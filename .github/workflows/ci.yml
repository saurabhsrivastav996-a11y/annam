name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test API
        run: npm test

      - name: Build client
        run: npm run build

      - name: End-to-end tests
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 http://localhost:5000/api/health --timeout 120000
          npm run test:e2e
        env:
          # No MONGODB_URI: the API boots its own in-memory database and seeds it.
          CI: true

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
