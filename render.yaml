# Render Blueprint for the Annam API.
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: annam-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Generated once by Render and kept; never commit a real secret.
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard - they are secrets.
      - key: MONGODB_URI
        sync: false
      # Your deployed frontend origin. Comma-separate to allow more than one.
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
