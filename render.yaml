# Render Blueprint for the Annam API.
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: annam-api
    runtime: node
    plan: free
    region: singapore
    # --include=dev is required: NODE_ENV=production below makes npm skip
    # devDependencies, and Vite lives there, so the client build would have no
    # bundler. The client is built here so one service serves API and app.
    buildCommand: npm ci --include=dev && npm run build --workspace client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Express serves the built client from the same origin: one URL, no CORS.
      # Set to false if you host the frontend separately (Vercel).
      - key: SERVE_CLIENT
        value: 'true'
      # Generated once by Render and kept; never commit a real secret.
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard - they are secrets.
      - key: MONGODB_URI
        sync: false
      # Your deployed frontend origin. Comma-separate to allow more than one.
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
